
name: Build MEQAT APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل المشروع
        uses: actions/checkout@v4

      - name: تجهيز Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: تجهيز Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: فك ملفات المشروع
        run: |
          unzip -q MEQAT-ANDROID-CLOUD.zip -d extracted
          test -f extracted/MEQAT-ANDROID/app/build.gradle.kts

      - name: تجهيز Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: إنشاء APK
        working-directory: extracted/MEQAT-ANDROID
        run: gradle --no-daemon assembleDebug

      - name: حفظ ملف APK
        uses: actions/upload-artifact@v4
        with:
          name: MEQAT-APK
          path: extracted/MEQAT-ANDROID/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
