
name: Build MEQAT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - MEQAT-ANDROID-CLOUD.zip
      - .github/workflows/build.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q MEQAT-ANDROID-CLOUD.zip -d extracted
          test -f extracted/MEQAT-ANDROID/app/build.gradle.kts

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: extracted/MEQAT-ANDROID
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MEQAT-APK
          path: extracted/MEQAT-ANDROID/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
